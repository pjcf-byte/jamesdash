<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Essential for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <style>
    /* Reset and dark mode styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a; /* Dark background */
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      /* Enforces exactly 2 columns */
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px; /* Keeps cards readable on larger screens */
    }

    /* Individual Cards */
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .card-subtext {
      font-size: 0.75rem;
      color: #10b981; /* Green accent color */
      margin-top: 4px;
    }

    /* Accent color options */
    .text-blue { color: #38bdf8; }
    .text-purple { color: #c084fc; }
    .text-amber { color: #fbbf24; }
    .text-red { color: #f87171; }
  </style>
</head>
<body>

  <header>
    <h1>Overview</h1>
  </header>

  <main class="dashboard-grid">
    <!-- Card 1 -->
    <div class="card">
  <div class="card-label">2025 Score</div>
  <div class="card-value" id="last-year-value">Loading...</div>
  <div class="card-subtext" id="last-year-date">--/--/----</div>
</div>

    <!-- Card 2 -->
    <div class="card">
      <div class="card-label">Focus Time</div>
      <div class="card-value">3.5<span style="font-size: 1rem;"> hrs</span></div>
      <div class="card-subtext">+30m today</div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="card-label">Water</div>
      <div class="card-value text-blue">1.8<span style="font-size: 1rem;"> L</span></div>
      <div class="card-subtext">Target: 2.5L</div>
    </div>

    <!-- Card 4 -->
    <div class="card">
      <div class="card-label">Budget</div>
      <div class="card-value">$42.50</div>
      <div class="card-subtext text-red">Spent today</div>
    </div>

    <!-- Card 5 -->
    <div class="card">
      <div class="card-label">Tasks Left</div>
      <div class="card-value text-amber">4</div>
      <div class="card-subtext">2 high priority</div>
    </div>

    <!-- Card 6 -->
    <div class="card">
      <div class="card-label">Streak</div>
      <div class="card-value text-purple">12<span style="font-size: 1rem;"> days</span></div>
      <div class="card-subtext">Reading habit</div>
    </div>

    <!-- Card 7 (Optional) -->
    <div class="card">
      <div class="card-label">Sleep</div>
      <div class="card-value">7.2<span style="font-size: 1rem;"> hrs</span></div>
      <div class="card-subtext">85% score</div>
    </div>

    <!-- Card 8 (Optional) -->
    <div class="card">
      <div class="card-label">Screen Time</div>
      <div class="card-value">2h 15m</div>
      <div class="card-subtext text-red">-12% vs avg</div>
    </div>
  </main>
<script>
  async function loadLastYearValue() {
    try {
      // 1. Fetch the CSV file
      const response = await fetch('data.csv');
      const csvText = await response.text();

      // 2. Parse CSV into a key-value dictionary
      const rows = csvText.trim().split('\n').slice(1);
      const dataMap = {};

      rows.forEach(row => {
        const [dateStr, valueStr] = row.split(',');
        if (dateStr && valueStr) {
          dataMap[dateStr.trim()] = valueStr.trim();
        }
      });

      // 3. Compute the date exactly 1 year ago today
      const today = new Date();
      const lastYearDate = new Date(today);
      lastYearDate.setFullYear(today.getFullYear() - 1);

      // 4. Format as British Date (DD/MM/YYYY)
      const day = String(lastYearDate.getDate()).padStart(2, '0');
      const month = String(lastYearDate.getMonth() + 1).padStart(2, '0');
      const year = lastYearDate.getFullYear();
      const targetDateStr = `${day}/${month}/${year}`;

      // 5. Look up value for that date
      const value = dataMap[targetDateStr];

      // 6. Display value or a fallback if date is missing
      if (value !== undefined) {
        document.getElementById('last-year-value').innerText = `£${value}`;
        document.getElementById('last-year-date').innerText = targetDateStr;
      } else {
        document.getElementById('last-year-value').innerText = 'N/A';
        document.getElementById('last-year-date').innerText = `No entry for ${targetDateStr}`;
      }

    } catch (err) {
      console.error('Error reading CSV:', err);
      document.getElementById('last-year-value').innerText = 'Error';
      document.getElementById('last-year-date').innerText = 'Could not load data.csv';
    }
  }

  loadLastYearValue();
</script>
</body>
</html>
