<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <style>
        :root {
            --green: #2e7d32;
            --red: #c62828;
            --amber: #f57f17;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0 15px 0;
            color: #1a1a1a;
        }

        /* Responsive 2-Column Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Max 2 boxes wide */
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Stack vertically on very small screens if needed, otherwise retains 2 columns */
        @media (max-width: 400px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .color-green { color: var(--green); }
        .color-amber { color: var(--amber); }
        .color-red { color: var(--red); }

        .diff-text {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Header 1 -->
    <h1>Header 1</h1>
    
    <div class="grid-container">
        <!-- Box 1 -->
        <div class="card">
            <div class="card-title">Learner Engagement</div>
            <div class="card-value color-green" id="box1-val">--</div>
        </div>

        <!-- Box 2 -->
        <div class="card">
            <div class="card-title">Recognition Points</div>
            <div class="card-value color-green" id="box2-val">--</div>
        </div>
    </div>

    <!-- Header 2 -->
    <h1>Header 2</h1>

    <div class="grid-container">
        <!-- Box 3 -->
        <div class="card">
            <div class="card-title">Current Metric</div>
            <div class="card-value color-amber" id="box3-val">--</div>
            <div class="diff-text" id="box3-diff">--</div>
        </div>

        <!-- Box 4 -->
        <div class="card">
            <div class="card-title">1 Year Ago Today</div>
            <div class="card-value" id="box4-val">--</div>
        </div>
    </div>
</div>

<script>
    async function loadDashboardData() {
        try {
            const response = await fetch('data.csv');
            const csvText = await response.text();
            
            // Clean up row line endings (\r\n vs \n) and drop empty lines
            const lines = csvText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length < 2) return;

            // Extract headers
            const headers = lines[0].split(',').map(h => h.trim());
            
            // Helper to pull clean numbers (handles spaces, £, commas)
            function getCleanNumber(rowArray, headerName) {
                const idx = headers.indexOf(headerName);
                if (idx === -1 || !rowArray[idx]) return NaN;
                // Remove non-numeric characters except decimals and minus signs
                const cleanedStr = rowArray[idx].replace(/[^0-9.-]/g, '');
                return parseFloat(cleanedStr);
            }

            // Extract row 1 (latest static values)
            const latestData = lines[1].split(',').map(cell => cell.trim());

            // 1. Box 1: Learner Engagement
            const box1Val = getCleanNumber(latestData, 'Learner Engagement');
            document.getElementById('box1-val').textContent = isNaN(box1Val) ? 'N/A' : box1Val.toLocaleString();

            // 2. Box 2: Recognition Points
            const box2Val = getCleanNumber(latestData, 'Recognition Points');
            document.getElementById('box2-val').textContent = isNaN(box2Val) ? 'N/A' : box2Val.toLocaleString();

            // 3. Box 3: Metric Value
            const box3Val = getCleanNumber(latestData, 'Metric Value');
            document.getElementById('box3-val').textContent = isNaN(box3Val) ? 'N/A' : box3Val.toLocaleString();

            // 4. Box 4: Look up value from 1 year ago today
            const targetDateStr = getTargetDateUK(); // Matches DD/MM/YYYY
            let box4Val = NaN;

            const dateIdx = headers.indexOf('Date');
            const metricIdx = headers.indexOf('Metric Value');

            // Search rows for matching date
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',').map(cell => cell.trim());
                if (row[dateIdx] === targetDateStr) {
                    box4Val = getCleanNumber(row, 'Metric Value');
                    break;
                }
            }

            if (!isNaN(box4Val)) {
                document.getElementById('box4-val').textContent = box4Val.toLocaleString();

                if (!isNaN(box3Val)) {
                    const diff = box3Val - box4Val;
                    const diffElement = document.getElementById('box3-diff');
                    
                    if (diff > 0) {
                        diffElement.textContent = `+${diff.toLocaleString()} vs 1 yr ago`;
                        diffElement.className = 'diff-text color-red';
                    } else if (diff < 0) {
                        diffElement.textContent = `${diff.toLocaleString()} vs 1 yr ago`;
                        diffElement.className = 'diff-text color-green';
                    } else {
                        diffElement.textContent = `No change vs 1 yr ago`;
                        diffElement.className = 'diff-text';
                    }
                }
            } else {
                document.getElementById('box4-val').textContent = 'N/A';
                document.getElementById('box3-diff').textContent = 'No historical data';
            }

        } catch (error) {
            console.error("Error parsing CSV:", error);
        }
    }

    function getTargetDateUK() {
        const date = new Date();
        date.setFullYear(date.getFullYear() - 1);

        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();

        return `${day}/${month}/${year}`;
    }

    loadDashboardData();
</script>

</body>
</html>
