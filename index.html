<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Essential for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <style>
    /* Reset and global dark theme styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a; /* Slate Dark Background */
      color: #f8fafc;            /* Crisp White Primary Text */
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #f1f5f9; /* Bright Header Text */
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    /* Strict 2-Column Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    /* Dark Mode Cards */
    .card {
      background-color: #1e293b; /* Dark Card Surface */
      border: 1px solid #334155; /* Subtle Dark Border */
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8; /* Muted Soft Grey */
      margin-bottom: 8px;
      font-weight: 500;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8; /* Highlight Accent Color (Sky Blue) */
    }

    .card-subtext {
      font-size: 0.75rem;
      color: #64748b; /* Secondary Subtext Grey */
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard</h1>
  </header>

  <main class="dashboard-grid">
    <!-- Card 1: Last Year Same Day Data (From CSV) -->
    <div class="card">
      <div class="card-label">Last Year Same Day</div>
      <div class="card-value" id="last-year-value">Loading...</div>
      <div class="card-subtext" id="last-year-date">--/--/----</div>
    </div>

    <!-- Additional Placeholder Cards (Replace with your own labels/data) -->
    <div class="card">
      <div class="card-label">Metric 2</div>
      <div class="card-value">--</div>
      <div class="card-subtext">Updated today</div>
    </div>

    <div class="card">
      <div class="card-label">Metric 3</div>
      <div class="card-value">--</div>
      <div class="card-subtext">Updated today</div>
    </div>

    <div class="card">
      <div class="card-label">Metric 4</div>
      <div class="card-value">--</div>
      <div class="card-subtext">Updated today</div>
    </div>

    <div class="card">
      <div class="card-label">Metric 5</div>
      <div class="card-value">--</div>
      <div class="card-subtext">Updated today</div>
    </div>

    <div class="card">
      <div class="card-label">Metric 6</div>
      <div class="card-value">--</div>
      <div class="card-subtext">Updated today</div>
    </div>
  </main>

  <script>
    async function loadLastYearValue() {
      try {
        // 1. Fetch CSV file from GitHub repository
        const response = await fetch('data.csv');
        const csvText = await response.text();

        // 2. Parse CSV into a map
        const rows = csvText.trim().split('\n').slice(1);
        const dataMap = {};

        rows.forEach(row => {
          const [dateStr, valueStr] = row.split(',');
          if (dateStr && valueStr) {
            dataMap[dateStr.trim()] = valueStr.trim();
          }
        });

        // 3. Compute exact date 1 year ago today
        const today = new Date();
        const lastYearDate = new Date(today);
        lastYearDate.setFullYear(today.getFullYear() - 1);

        // 4. Format date as British standard (DD/MM/YYYY)
        const day = String(lastYearDate.getDate()).padStart(2, '0');
        const month = String(lastYearDate.getMonth() + 1).padStart(2, '0');
        const year = lastYearDate.getFullYear();
        const targetDateStr = `${day}/${month}/${year}`;

        // 5. Look up value
        const value = dataMap[targetDateStr];

        // 6. Update UI elements
        if (value !== undefined) {
          document.getElementById('last-year-value').innerText = `£${value}`;
          document.getElementById('last-year-date').innerText = targetDateStr;
        } else {
          document.getElementById('last-year-value').innerText = 'N/A';
          document.getElementById('last-year-date').innerText = `No record for ${targetDateStr}`;
        }

      } catch (err) {
        console.error('Error fetching data.csv:', err);
        document.getElementById('last-year-value').innerText = 'Error';
        document.getElementById('last-year-date').innerText = 'Could not load data.csv';
      }
    }

    loadLastYearValue();
  </script>

</body>
</html>
